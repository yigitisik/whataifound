<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111310">
<!-- Declares the page supports both palettes, dark preferred, before styles.css
     loads. styles.css then sets color-scheme per resolved theme. Without this the
     native scrollbars and <select> dropdown lists paint light on a dark page. -->
<meta name="color-scheme" content="dark light">
<title>Page not found | whataifound.org</title>
<meta name="robots" content="noindex, follow">
<!-- Icons. The PNG rel="icon" entries matter for search: Google's favicon crawler
     documents .ico/.png/.jpg/.gif support and does not list SVG, so an SVG-only site
     tends to show a generic globe in results. SVG stays first for crisp browser tabs;
     /favicon.ico is the path Google probes when no <link> is usable. -->
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/icon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="mask-icon" href="/assets/brand/favicon.svg" color="#0b0d10">
<link rel="manifest" href="/site.webmanifest">
<script>try{var tm=localStorage.getItem('theme'),el=document.documentElement;if(tm==='light'||tm==='dark')el.setAttribute('data-theme',tm);else if(tm!=='system')el.setAttribute('data-theme','dark');
/* Match the chrome tint to the theme that rendered; the static tag is the dark default. */
var lt=tm==='light'||(tm==='system'&&window.matchMedia('(prefers-color-scheme: light)').matches);
if(lt){var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#faf9f6';}}catch(e){}</script>
<style>
  @font-face{font-family:'Newsreader';src:url('/assets/fonts/news-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Newsreader';src:url('/assets/fonts/news-600.woff2') format('woff2');font-weight:600;font-display:swap}
  :root{--bg:#faf9f6;--panel:#ffffff;--ink:#191917;--muted:#6a6760;--line:#e5e1d9;--line-strong:#d3cec3;
    --accent:#12513a;--accent-soft:#e9f1ec;--serif:'Newsreader',Georgia,Palatino,serif;
    --ease:cubic-bezier(.22,.7,.24,1)}
  @media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#111310;--panel:#181a15;--ink:#ecebe0;
    --muted:#9c998d;--line:#2a2d24;--line-strong:#3a3e32;--accent:#7ec6a3;--accent-soft:#1a251f}}
  :root[data-theme="dark"]{--bg:#111310;--panel:#181a15;--ink:#ecebe0;--muted:#9c998d;--line:#2a2d24;
    --line-strong:#3a3e32;--accent:#7ec6a3;--accent-soft:#1a251f}
  *{box-sizing:border-box}
  /* Two rows: the card centres in the space above, the footer sits on the baseline. */
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--serif);display:grid;grid-template-rows:1fr auto;justify-items:center;
    padding:24px;-webkit-font-smoothing:antialiased}
  .card{max-width:520px;text-align:center;align-self:center}
  /* This page is deliberately self-contained (see the README): it has to render if
     styles.css never arrives, so the shared chrome cannot be used and the parts it needs
     are inlined here instead. Kept to the theme switcher and a link row: a 404 wants a
     way out and a way to change the theme, not the full four-cell footer. */
  .mini-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;
    padding-top:28px;font-size:.78rem}
  .mini-foot nav{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .mini-foot a{color:var(--muted);text-decoration:none}
  .mini-foot a:hover{color:var(--accent)}
  .mini-foot .colophon{margin:0;font-size:.72rem;color:var(--muted);width:100%;text-align:center}
  .theme-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden}
  .theme-seg .th{width:31px;height:26px;display:grid;place-items:center;background:transparent;border:0;
    border-right:1px solid var(--line);cursor:pointer;color:var(--muted);transition:color .15s,background .15s}
  .theme-seg .th:last-child{border-right:0}
  .theme-seg .th:hover{color:var(--ink)}
  .theme-seg .th[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
  .theme-seg .th svg{width:15px;height:15px;display:block}
  .mark{color:var(--accent);opacity:.9;margin-bottom:22px}
  .code{font-size:.68rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);
    font-weight:600;margin:0 0 10px}
  h1{font-size:1.9rem;font-weight:600;letter-spacing:-.01em;margin:0 0 14px;line-height:1.25}
  p{color:var(--muted);font-size:1.02rem;line-height:1.6;margin:0 auto 26px;max-width:42ch}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-size:.82rem;letter-spacing:.02em;
    padding:11px 20px;border-radius:11px;border:1px solid var(--line-strong);color:var(--ink);
    transition:border-color .16s var(--ease),background .16s,transform .16s}
  a.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  a.btn.primary{background:var(--accent);border-color:var(--accent);
    color:var(--bg)}
  a.btn.primary:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" width="42" height="42" aria-hidden="true">
      <defs>
        <linearGradient id="mk-404" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5aa9e6"/>
          <stop offset="0.5" stop-color="#7c6cf0"/>
          <stop offset="1" stop-color="#d98a4a"/>
        </linearGradient>
      </defs>
      <path d="M2.6 12 L12 2.6 L21.4 12" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M2.6 12 L12 21.4 L21.4 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M6.9 8.75 L17.1 8.75 L18.35 10.05 L5.65 10.05 Z" fill="currentColor" fill-opacity="0.55"/>
      <path d="M9.9 11.4 h4.2 v1.1 h-1.35 v4.4 h1.35 v1.1 h-4.2 v-1.1 h1.35 v-4.4 h-1.35 z" fill="url(#mk-404)"/>
    </svg>
    <p class="code">Error 404</p>
    <h1>This page is not on the record</h1>
    <p>The link may be broken, or the page may have moved. Everything we track lives back on the
    registry, where nothing gets deleted.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to the registry</a>
      <a class="btn" href="/methodology">How we grade</a>
    </div>
  </div>

  <footer class="mini-foot">
    <nav aria-label="Site">
      <a href="/">Registry</a>
      <a href="/review">Review queue</a>
      <a href="/visuals">Visuals</a>
      <a href="/methodology">Methodology</a>
      <a href="/contributors">Contributors</a>
    </nav>
    <span class="theme-seg" role="group" aria-label="Colour theme">
      <button type="button" class="th" data-mode="light" aria-label="Light theme" aria-pressed="false" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/></svg>
      </button>
      <button type="button" class="th" data-mode="system" aria-label="System theme" aria-pressed="false" title="System">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>
      </button>
      <button type="button" class="th" data-mode="dark" aria-label="Dark theme" aria-pressed="false" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.3A8 8 0 1 1 10.7 3.5 6.3 6.3 0 0 0 20.5 13.3z"/></svg>
      </button>
    </span>
    <p class="colophon">© 2026 Isik &amp; Co.</p>
  </footer>

<!-- Same-origin, deferred, and purely an enhancement: it wires the switcher above. If it
     never loads the page still renders and the stored theme still applies, because the
     initialiser in <head> is inline. -->
<script src="/js/chrome.js" defer></script>
</body>
</html>
