name: rebuild submission

# Submissions made through the site arrive as a branch pushed by the project's GitHub
# App: `submission/<proposal-id>`, carrying a change to data/entries.json and nothing
# else. This workflow does the part the App is deliberately not allowed to do, which is
# run the build and commit its output.
#
# Read the first step as the security boundary of the whole in-UI contribution path.
# The App's credential can write to this repository, so the question that matters is
# what it can write. It holds Contents and Pull requests permissions and nothing else,
# and this asserts the rest: if a submission branch touches any file other than
# data/entries.json, the job fails and nothing is rebuilt or committed. That closes the
# bot path as a route to change scripts/, app.js, chrome.js or .github/.
#
# Why `push` and not `pull_request`. A pull_request run against a fork gets no writable
# token, and pull_request_target would give one while checking out untrusted code, which
# is the classic way this kind of workflow is exploited. These branches are pushed to
# this repository by the App, never by a fork, so a plain push trigger is both
# sufficient and the least dangerous option available.
#
# A maintainer still reviews and merges. Nothing here approves anything.

on:
  push:
    branches: ['submission/**']

permissions:
  contents: write

concurrency:
  # One run per branch. A second push while the first is still committing would race on
  # the same ref and one of them would be rejected.
  group: rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole branch: the guard below diffs against the base branch, and a
          # shallow clone has no merge base to diff against.
          fetch-depth: 0

      - name: Refuse a submission branch that changes anything but the registry
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$base"

          # Three-dot: what this branch changed relative to where it diverged, so
          # commits that landed on the base branch meanwhile are not counted as ours.
          changed=$(git diff --name-only "origin/$base...HEAD")
          echo "Files changed on this branch:"
          echo "$changed"

          # Compared against the literal path, not a pattern. A prefix match would
          # accept data/entries.json.bak, and a suffix match would accept
          # evil/data/entries.json.
          unexpected=$(echo "$changed" | grep -v '^data/entries\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::A submission branch may only change data/entries.json."
            echo "$unexpected" | while read -r f; do
              [ -n "$f" ] && echo "::error file=$f::$f is not allowed on a submission branch"
            done
            exit 1
          fi

          if [ -z "$changed" ]; then
            echo "::error::This branch changes nothing."
            exit 1
          fi
          echo "Only data/entries.json changed."

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The same check main runs, on the data the submission proposes. A payload that
      # got past the API's validation is refused here before anything is generated
      # from it.
      - name: Check the registry for smuggled markup
        run: python3 scripts/check-integrity.py

      - name: Rebuild
        run: python3 scripts/build.py

      - name: Commit the regenerated site
        run: |
          set -euo pipefail
          # feed.xml's lastBuildDate changes on every run and carries no registry
          # content. Committing it would put a meaningless diff on every submission.
          git checkout -- feed.xml
          if git diff --quiet; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git config user.name "whataifound bot"
          git config user.email "bot@whataifound.org"
          git add -A
          git commit -m "Rebuild generated files

          Generated by scripts/build.py from the data change on this branch.
          Do not hand-edit: the next push regenerates all of it."
          git push origin HEAD

      # After the rebuild, the branch must satisfy exactly what main satisfies. If it
      # does not, the submission is not mergeable and saying so here is cheaper than
      # a maintainer finding out at merge time.
      - name: Verify the rebuilt branch
        run: |
          python3 scripts/check-integrity.py
          python3 scripts/build.py
          git checkout -- feed.xml
          if ! git diff --quiet; then
            echo "::error::The build is not deterministic on this branch."
            git diff --stat
            exit 1
          fi
          echo "Rebuilt branch is clean and reproducible."
