name: build

# The generated files (index.html's entry block, finding/, llms.txt, sitemap.xml,
# feed.*) are committed, so a PR carries tens of thousands of lines of machine-written
# HTML that no reviewer reads closely. Two things are checked here, in this order:
#
#   1. Integrity of what was actually committed, BEFORE any rebuild. A rebuild would
#      overwrite tampering in the fully generated files and hide it, so this has to
#      look at the PR's own bytes first.
#   2. That rebuilding from data/entries.json reproduces those bytes, which catches a
#      forgotten rebuild and any hand-edit inside the marker regions.
#
# Note on trust: under `pull_request`, GitHub runs the workflow file and the scripts as
# they are in the PR's merge commit, so a PR that edits this file or anything in
# scripts/ decides what these checks do, including whether they run at all. The token is
# read-only and there are no secrets, so the worst it can do is report green. That makes
# every step below a check of the *data*, trustworthy only when the PR leaves .github/
# and scripts/ alone. comment.yml, which runs from the base branch, reads the PR's file
# list from the API and says so above the report when it does not. Treat any change to
# .github/ or scripts/ in a contributor PR as a code change, not an entry change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      # verify-parity.py runs app.js's real card() to diff it against the
      # pre-rendered markup, so Node is required for the full check.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # Runs first and on the committed bytes: a payload in a fully generated file
      # would be erased by the rebuild below and never show up in a diff.
      - name: Check committed files for smuggled markup
        run: python3 scripts/check-integrity.py

      - name: Rebuild from data/entries.json
        run: python3 scripts/build.py

      # The functions under api/ hold the session, the handle rules and the registry
      # block the schema is checked against. They are the only code here the static
      # build cannot verify by rebuilding, so they carry unit tests. Runs after the
      # rebuild because registry.test.js reads the generated api/_lib/registry.js.
      - name: Test the Vercel functions
        run: |
          npm ci
          npm test

      - name: Fail if the committed site is out of date
        run: |
          # feed.xml's lastBuildDate is a timestamp that changes on every run; it
          # carries no registry content, so it is excluded from the drift check.
          git checkout -- feed.xml
          if ! git diff --quiet; then
            echo "::error::Generated files differ from data/entries.json."
            echo "Run 'python3 scripts/build.py' and commit the result."
            echo
            git diff --stat
            git diff
            exit 1
          fi
          echo "Committed site matches data/entries.json."

      # A PR that changes anything outside data/entries.json is a code change and
      # needs reading as one. This does not fail the build; it labels the diff so the
      # distinction is visible in the checks rather than inferred from the file list.
      # A PR can edit this step away, so it is a convenience; the warning that counts
      # is the one comment.yml posts from the base branch.
      - name: Classify the change
        if: github.event_name == 'pull_request'
        run: |
          # Two-dot, not three-dot: actions/checkout fetches shallowly, so the
          # merge-base a three-dot diff needs does not exist and it silently
          # returns nothing. Two-dot compares the fetched tip directly.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD HEAD)
          echo "Changed files:"; echo "$changed"
          # js/, not app.js: the front end lives under js/, so an anchored ^app\.js
          # could never match and every front-end PR went unlabelled.
          if echo "$changed" | grep -qE '^(scripts/|\.github/|js/|api/|db/|package(-lock)?\.json|vercel\.json)'; then
            echo "::warning::This PR touches build scripts, CI, the front end, the API or dependencies. Review as a code change, not an entry."
          fi

      # Summarise the entry changes for the reviewer. Written to a file, never posted
      # from here: this job checks out PR code, so it stays `contents: read`. The
      # privileged job that posts it lives in comment.yml and runs no PR code at all.
      # Both files are the PR's to write, so comment.yml treats them as untrusted: it
      # finds the PR itself and refuses a pr-number that disagrees.
      - name: Build PR report
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-report
          echo "${{ github.event.number }}" > pr-report/pr-number
          python3 scripts/pr-report.py FETCH_HEAD > pr-report/body.md || true
          cat pr-report/body.md

      - name: Upload PR report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-report
          path: pr-report/
          if-no-files-found: ignore
