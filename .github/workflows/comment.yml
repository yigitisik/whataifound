name: comment

# Posts the entry summary from `build` onto the pull request.
#
# SECURITY: this is the only workflow in the repo with a write token, so the rules that
# keep it safe are worth stating rather than inferring.
#
#   1. It triggers on `workflow_run`, so it runs from the *base* branch. A fork PR cannot
#      change what this file does.
#   2. It NEVER checks out the head repository and never runs any code from the PR.
#      There is no `actions/checkout` here on purpose. Adding one, or running any script
#      from the PR, hands a write token to an untrusted contributor.
#   3. The only thing it consumes is an artifact built by the untrusted job. That content
#      is attacker-controlled, and scripts/pr-report.py already neutralises markdown and
#      HTML in it; it is posted verbatim and never evaluated as a shell string.
#
# Why not just give `build` these permissions: `build` checks out the PR's own code and
# runs its scripts, so a token there would be a token any contributor could take.

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # No artifact means a push build rather than a PR; nothing to say.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download report
        id: dl
        uses: actions/download-artifact@v4
        with:
          name: pr-report
          path: pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Post or update the comment
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'pr-report';
            if (!fs.existsSync(`${dir}/pr-number`) || !fs.existsSync(`${dir}/body.md`)) return;

            // Trust nothing from the artifact. The PR number must be digits, and the
            // body is inserted as data, never interpolated into a shell or a script.
            const raw = fs.readFileSync(`${dir}/pr-number`, 'utf8').trim();
            if (!/^\d+$/.test(raw)) { core.setFailed('bad pr-number'); return; }
            const issue_number = Number(raw);

            let report = fs.readFileSync(`${dir}/body.md`, 'utf8');
            if (report.length > 60000) report = report.slice(0, 60000) + '\n\n_(truncated)_';

            const MARK = '<!-- whataifound-pr-report -->';
            const body = [
              MARK,
              '### Entry changes in this PR',
              '',
              report.trim() || '_No entry changes._',
              '',
              '---',
              'CI checks the mechanics: that the data is valid, that the committed site',
              'matches `data/entries.json`, and that every source URL resolves. It cannot',
              'tell whether a claim is true. Open the primary sources and check the grades',
              'against the evidence, not against the summary above.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const mine = existing.data.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(MARK));

            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body });
            }
