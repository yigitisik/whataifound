name: cleanup deployments

# The Vercel GitHub integration opens a deployment record for every push and never closes
# them, so the repository's Deployments list grows without bound. This prunes it.
#
# Two environments, two policies, because they mean different things:
#
#   Preview     every record is per-PR noise the moment the PR closes. Delete all of them.
#   Production  a record is a pointer to what shipped, so it is kept for RETENTION_DAYS
#               and then dropped. It holds nothing unrecoverable: the sha is in git
#               history, and the deploy log and rollback both live in Vercel, which this
#               workflow cannot reach.
#
# Why Production is done by hand rather than with the action below: that action takes an
# environment and deletes everything in it, with no age filter of any kind. Pointing it at
# Production would remove the live record along with the rest.
#
# SECURITY: this holds a write-scoped token, so it follows the rule comment.yml sets out.
# It checks out nothing and runs no code from any branch or pull request. Do not add
# actions/checkout here, and do not widen the token to write-all.

on:
  schedule:
    # Monday 06:30 UTC, half an hour after the links sweep so the two do not overlap.
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete Production records older than this many days'
        required: false
        default: '90'

permissions:
  deployments: write

concurrency:
  # Two overlapping sweeps would race on the same records and 404 each other.
  group: cleanup-deployments
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      # 90 days matches GitHub's own default retention for Actions logs and artifacts,
      # which is the closest in-platform convention for CI metadata. Overridable on a
      # manual run so the Production path can be exercised before it fires on its own.
      RETENTION_DAYS: ${{ github.event.inputs.retention_days || '90' }}
    steps:
      # Preview has no retention window: every record is disposable, and wiping the
      # environment wholesale is what this action does well.
      - name: Delete all Preview deployment records
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Matched exactly, and Vercel capitalises it. 'preview' would match nothing.
          environment: Preview
          # Keep the environment itself; Vercel reuses it on the next preview deploy.
          onlyRemoveDeployments: true

      # Production is age-filtered, so it goes against the API directly. Two rules make it
      # safe to run unattended:
      #   1. Only records strictly older than RETENTION_DAYS are candidates.
      #   2. The newest Production record is never a candidate, whatever its age, so the
      #      live deployment survives even if the cutoff is misconfigured.
      - name: Delete Production records older than RETENTION_DAYS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Retention: ${RETENTION_DAYS} days"
          echo "Cutoff:    $(date -u -d "@${cutoff}" +%Y-%m-%dT%H:%M:%SZ)"

          # Newest first, so .[1:] drops the current live record from the candidate list.
          gh api --paginate "repos/${REPO}/deployments" \
            --jq '[.[] | select(.environment=="Production")]
                  | sort_by(.created_at) | reverse | .[1:]
                  | .[] | "\(.id) \(.created_at)"' > candidates.txt

          kept=0
          deleted=0
          while read -r id created; do
            [ -n "${id:-}" ] || continue
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then
              kept=$((kept + 1))
              continue
            fi
            # An active deployment cannot be deleted, so retire it first.
            gh api --method POST "repos/${REPO}/deployments/${id}/statuses" \
              -f state=inactive --silent
            gh api --method DELETE "repos/${REPO}/deployments/${id}" --silent
            echo "Deleted ${id} (${created})"
            deleted=$((deleted + 1))
          done < candidates.txt

          echo "Deleted ${deleted} Production record(s); kept ${kept} inside the window,"
          echo "plus the newest record, which is never a candidate."
