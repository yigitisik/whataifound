<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#12161b"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="0.5" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#d98a4a"/>
    </linearGradient>
    <!-- The mark's own gradient runs on the diagonal, matching mark.svg exactly. -->
    <linearGradient id="markgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="0.5" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#d98a4a"/>
    </linearGradient>
    <!-- The "ai" ramp, in the wordmark group's own coordinates (it is inside the
         translate(80,90) g), so it sweeps both glyphs as one run rather than
         restarting per letter. Coordinates are the measured glyph box. -->
    <linearGradient id="ai" gradientUnits="userSpaceOnUse" x1="155" y1="16" x2="180" y2="42">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="0.55" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#d98a4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#grad)"/>
  <!-- Brand lockup: the 24x24 mark scaled 2.5x, then the wordmark, per lockup.svg. -->
  <g transform="translate(80,90)">
    <g transform="scale(2.5)">
      <path d="M2.6 12 L12 2.6 L21.4 12" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M2.6 12 L12 21.4 L21.4 12" fill="none" stroke="#e6e8ea" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M6.9 8.75 L17.1 8.75 L18.35 10.05 L5.65 10.05 Z" fill="#9aa4ae"/>
      <path d="M9.9 11.4 h4.2 v1.1 h-1.35 v4.4 h1.35 v1.1 h-4.2 v-1.1 h1.35 v-4.4 h-1.35 z" fill="url(#markgrad)"/>
    </g>
    <text x="78" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="0.6" fill="#e6e8ea">what<tspan fill="url(#ai)">ai</tspan>found<tspan fill="#6b7580">.org</tspan></text>
  </g>
  <text x="1120" y="128" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="1" fill="#6b7580">Isik &amp; Co.</text>
  <text x="80" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#f2f4f6">What AI has</text>
  <text x="80" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="url(#grad)">actually discovered</text>
  <text x="80" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#9aa4ae">A curated registry of scientific and mathematical results found</text>
  <text x="80" y="494" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#9aa4ae">by AI, graded on how they were verified and how much the AI did.</text>
  <g font-family="Georgia, serif" font-size="22" fill="#c4ccd4">
    <text x="80" y="580">Formally verified · Independently checked · Peer reviewed · Claimed · Disputed · Refuted</text>
  </g>
</svg>
