  <text class="sg" x="440" y="105" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#e6e8ea">what<tspan fill="url(#ai)">ai</tspan>found<tspan fill="#6b7580" font-weight="400">.org</tspan></text>
  <rect x="655" y="86" width="1" height="20" fill="#ffffff" fill-opacity="0.14"></rect>
  <text class="mono" x="676" y="103" font-size="13" letter-spacing="2.3" fill="#6b7580">ISIK &amp; CO.</text>

  <text class="sg" x="600" y="255" text-anchor="middle" font-size="70" font-weight="600" letter-spacing="-2.4" fill="#F2EFE7">What AI has</text>
